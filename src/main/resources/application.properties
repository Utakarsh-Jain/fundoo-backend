
spring.application.name=fundoo-notes

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ActiveMQ Configuration
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.jms.pub-sub-domain=false

# JMS Queue
app.jms.user-registration-queue=user.registration.queue


# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Queue
app.rabbitmq.reminder-queue=fundoo.reminder.queue

# RabbitMQ Exchange
app.rabbitmq.reminder-exchange=fundoo.reminder.exchange

# RabbitMQ Routing Key
app.rabbitmq.reminder-routing-key=reminder.created


# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# Redis Key Expiry
app.redis.otp-expiration=300
app.redis.token-expiration=86400
app.redis.verification-token-expiration=86400
app.redis.password-reset-token-expiration=1800

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend Links
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Spring Cache Configuration
spring.cache.type=simple

# Attachment Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.attachments.storage-dir=${ATTACHMENT_STORAGE_DIR:./uploads}
app.attachments.max-size-mb=${ATTACHMENT_MAX_SIZE_MB:10}
app.attachments.allowed-types=${ATTACHMENT_ALLOWED_TYPES:image/png,image/jpeg,image/gif,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}

# Spring Batch Configuration
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always